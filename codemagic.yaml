# Codemagic build pipeline for Felapps-generated iOS apps.
# The Felapps backend triggers this workflow through the Codemagic REST API.
workflows:
  ios-publish:
    name: iOS Publish (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6.0
    scripts:
      - name: Configure project
        script: bash configure.sh
      - name: Generate Xcode project
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "Installing XcodeGen..."
            curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip \
              && unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen \
              && export PATH="/tmp/xcodegen/xcodegen/bin:$PATH" \
              || brew install xcodegen
          fi
          xcodegen generate
      - name: Save Apple API key
        script: printf '%b\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$CM_BUILD_DIR/AuthKey.p8"
      - name: Build and archive
        script: |
          set -e
          xcodebuild -project "$(ls -d *.xcodeproj | head -1)" \
            -scheme FelappApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/Felapp.xcarchive" \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CM_BUILD_DIR/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Export IPA
        script: |
          set -e
          cat > "$CM_BUILD_DIR/exportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/Felapp.xcarchive" \
            -exportPath "$CM_BUILD_DIR/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CM_BUILD_DIR/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # Apple credentials are passed to the build by Felapps as secret environment variables.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
