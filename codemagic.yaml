# Codemagic build pipeline for Felapps-generated iOS apps.
# The Felapps backend triggers this workflow through the Codemagic REST API.
workflows:
  ios-publish:
    name: iOS Publish (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6.0
    scripts:
      - name: Configure project
        script: bash configure.sh
      - name: Generate Xcode project
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "Installing XcodeGen..."
            curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip \
              && unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen \
              && export PATH="/tmp/xcodegen/xcodegen/bin:$PATH" \
              || brew install xcodegen
          fi
          xcodegen generate
      - name: Set up App Store signing
        script: |
          set -e
          curl -fsSL "$CERT_KEY_URL" -o /tmp/cert_key.pem
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$(ls -d *.xcodeproj | head -1)" \
            --scheme FelappApp
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # Apple credentials are passed to the build by Felapps as secret environment variables.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
